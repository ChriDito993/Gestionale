name: Verifiche gestionale

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHON_DOTENV_DISABLED: '1'
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      SECRET_KEY: ci-test-session-secret
      ADMIN_EMAIL: browser@example.invalid
      ADMIN_PASSWORD: browser-test-password
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.13.1'
          cache: npm
      - name: Installa librerie Python verificate
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Controlla le dipendenze
        run: python -m pip check
      - name: Test Python
        run: python -m pytest -q --disable-warnings
      - name: Installa strumenti browser
        run: npm ci --ignore-scripts
      - name: Test JavaScript
        run: npm run test:unit
      - name: Installa Chromium e WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Flussi completi nel browser
        run: npm run test:e2e
      - name: Conserva il report dei test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: report-browser-tests
          path: playwright-report/
          retention-days: 7
